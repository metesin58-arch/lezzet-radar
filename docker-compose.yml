services:
  db:
    # Multi-arch PostGIS image (amd64 + arm64): it also runs on Oracle's ARM servers
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_USER: lezzet
      POSTGRES_PASSWORD: lezzet
      POSTGRES_DB: lezzet
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lezzet"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  web:
    image: lezzet-radar-web
    build: .
    environment:
      DATABASE_URL: postgres://lezzet:lezzet@db:5432/lezzet
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "${WEB_BIND:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: lezzet-radar-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://lezzet:lezzet@db:5432/lezzet
      SCRAPE_DIR: ${SCRAPE_DIR:-/tmp/lezzet-scrape}
      SCRAPER_IMAGE: ${SCRAPER_IMAGE:-gosom/google-maps-scraper@sha256:1dd971ebc2f090f6d879f701ea72358c89e363a952d5e10e9bdfe300fc43851f}
      SCRAPER_DEPTH: ${SCRAPER_DEPTH:-2}
      SCRAPER_EXTRA_DOCKER_ARGS: ${SCRAPER_EXTRA_DOCKER_ARGS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The worker passes this folder to a sibling container, so it must have the same path on host and in the container.
      - ${SCRAPE_DIR:-/tmp/lezzet-scrape}:${SCRAPE_DIR:-/tmp/lezzet-scrape}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # HTTPS: free Let's Encrypt certificate. Start with `--profile https` and set SITE_ADDRESS.
  # Without a domain, SITE_ADDRESS=<ip>.sslip.io works too (e.g. 141-147-1-2.sslip.io).
  caddy:
    image: caddy:2.8
    profiles: ["https"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  dbdata:
  caddy_data:
